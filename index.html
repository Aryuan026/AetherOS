


<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>AetherOS</title>
    <meta name="description" content="AetherOS：本机优先的虚拟手机、角色陪伴与历史对话迁入实验。" />
    <meta name="application-name" content="AetherOS" />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#17133d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AetherOS" />
    
    <!-- Updated Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-soft-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

    <style>
      :root {
        --primary-hue: 245; 
        --primary-sat: 25%;
        --primary-lightness: 65%;
        --safe-area-bottom: env(safe-area-inset-bottom);
        --app-height: 100lvh;
        --keyboard-inset: 0px;
        --app-font: 'Quicksand', sans-serif;
      }
      html, body, #root {
        width: 100%;
        min-height: var(--app-height, 100lvh);
        height: var(--app-height, 100lvh);
      }
      body {
        background-color: #0f1115;
        margin: 0;
        overflow: hidden;
        /* Critical: Prevent browser back/forward swipe navigation AND vertical rubber-banding */
        overscroll-behavior: none;
        /* Prevent text selection to feel like an app */
        user-select: none;
        -webkit-user-select: none;
        height: var(--app-height);
        min-height: var(--app-height);
        width: 100vw;
        font-family: var(--app-font);
      }
      body.ios-standalone {
        min-height: var(--app-height);
        height: var(--app-height);
        overscroll-behavior-y: auto;
        overscroll-behavior-x: none;
      }
      body.ios-standalone #root {
        min-height: var(--app-height);
        height: var(--app-height);
      }
      /* Global scroll behavior fix */
      .no-overscroll {
        overscroll-behavior: none;
      }
      .overscroll-contain {
        overscroll-behavior: contain;
      }
      /* Re-enable selection for inputs */
      input, textarea {
        user-select: text;
        -webkit-user-select: text;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
      }
      /* Utility for Safe Area */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
      @keyframes datePresenceFlow {
        0% { transform: translateX(-120%); opacity: 0; }
        18% { opacity: 0.85; }
        62% { opacity: 0.85; }
        100% { transform: translateX(220%); opacity: 0; }
      }
      .date-presence-flow {
        animation: datePresenceFlow 1.45s ease-in-out infinite;
      }
      #aetheros-boot {
        box-sizing: border-box;
        min-height: var(--app-height, 100lvh);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        color: rgba(255, 255, 255, 0.92);
        font-family: var(--app-font);
        letter-spacing: 0.08em;
      }
      #aetheros-boot strong {
        font-size: 1rem;
        font-weight: 600;
      }
      #aetheros-boot span {
        color: rgba(255, 255, 255, 0.58);
        font-size: 0.78rem;
        letter-spacing: 0.02em;
      }
      #aetheros-boot[data-state='failed'] span {
        color: #fecaca;
      }
    </style>
</head>
  <body>
    <div id="root">
      <div id="aetheros-boot" role="status" aria-live="polite">
        <strong>AetherOS</strong>
        <span>正在打开本机世界…</span>
      </div>
    </div>
    <script>
      (() => {
        const boot = document.getElementById('aetheros-boot');

        const showFailure = () => {
          if (!boot || !boot.isConnected) return;
          const text = boot.querySelector('span');
          if (text) text.textContent = '没有顺利打开，请刷新页面再试一次';
          boot.setAttribute('data-state', 'failed');
        };

        window.addEventListener('error', showFailure, { once: true });
        window.addEventListener('unhandledrejection', showFailure, { once: true });
        window.setTimeout(showFailure, 12000);
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
